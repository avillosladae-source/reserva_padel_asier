name: Reserva automatica pista padel

on:
  schedule:
   # 05:50 UTC -> ~07:50 hora Madrid en horario de VERANO (CEST, UTC+2)
    - cron: '00 21 * * 3'
   # 06:50 UTC -> ~07:50 hora Madrid en horario de INVIERNO (CET, UTC+1)
    #- cron: '00 0 * * *'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestana "Actions" para probar
#0 o 7 = domingo
#1 = lunes
#2 = martes
#3 = miércoles
#4 = jueves
#5 = viernes
#6 = sábado

jobs:
  reservar:
    runs-on: ubuntu-latest
    env:
      OPEN_HHMM: '12:40'
      EARLY_SECONDS: '0.30'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de reserva
        env:
          NUBAPP_USERNAME: ${{ secrets.NUBAPP_USERNAME }}
          NUBAPP_PASSWORD: ${{ secrets.NUBAPP_PASSWORD }}
          NUBAPP_ID_USER: ${{ secrets.NUBAPP_ID_USER }}
          NUBAPP_ID_APPLICATION: '94168645' 
          TARGET_WEEKDAY: 'thursday'   # dia de la semana objetivo: monday/tuesday/wednesday/thursday/friday/saturday/sunday
          FROM_TIME: '20:30'           # hora de inicio de la pista
          TO_TIME: '22:00'             # hora de fin de la pista
          ID_CATEGORY: '3967'          # categoria de pista (la capturada)
          ID_FACILITY: '10999'         # pista concreta (la capturada), 10997 pista 1, 10998 pista 2, 10999 pista 3, 11000 pista 4, 11001 pista 5, 11002 pista 6 
          BOOKED_ON: '3'
        run: python reservar.py
